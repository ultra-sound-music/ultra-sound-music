[package]
name = "usm-auction"
version = "0.1.0"
description = "USM custom English-auction program for Metaplex Core NFTs"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "usm_auction"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
mpl-core = { version = "0.12", features = ["anchor-0-32"], default-features = false }
